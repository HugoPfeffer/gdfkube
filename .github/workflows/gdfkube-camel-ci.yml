name: gdfkube-camel CI

on:
  push:
    branches: [main]
    paths:
      - 'gdfkube-src/gdfkube-camel/**'
      - '.github/workflows/gdfkube-camel-ci.yml'
  pull_request:
    paths:
      - 'gdfkube-src/gdfkube-camel/**'
      - '.github/workflows/gdfkube-camel-ci.yml'

permissions: {}

defaults:
  run:
    working-directory: gdfkube-src/gdfkube-camel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gdfkube-src/gdfkube-camel/pom.xml
      - run: ./mvnw -B -DskipITs=false verify
