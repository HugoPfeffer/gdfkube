name: gdfkube-camel CI

on:
  push:
    branches: [main]
    paths:
      - 'gdfkube-src/gdfkube-camel/**'
      - '.github/workflows/gdfkube-camel-ci.yml'
  pull_request:
    paths:
      - 'gdfkube-src/gdfkube-camel/**'
      - '.github/workflows/gdfkube-camel-ci.yml'

permissions: {}

defaults:
  run:
    working-directory: gdfkube-src/gdfkube-camel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gdfkube-src/gdfkube-camel/pom.xml
      - run: ./mvnw -B -DskipITs=false verify
