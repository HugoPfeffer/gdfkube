name: gdfkube-itsm CI

on:
  push:
    branches: [main]
    paths:
      - 'gdfkube-src/gdfkube-itsm/**'
      - '.github/workflows/gdfkube-itsm-ci.yml'
  pull_request:
    paths:
      - 'gdfkube-src/gdfkube-itsm/**'
      - '.github/workflows/gdfkube-itsm-ci.yml'

defaults:
  run:
    working-directory: gdfkube-src/gdfkube-itsm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gdfkube-src/gdfkube-itsm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
