name: gdfkube-itsm CI

on:
  push:
    branches: [main]
    paths:
      - 'gdfkube-src/gdfkube-itsm/**'
      - '.github/workflows/gdfkube-itsm-ci.yml'
  pull_request:
    paths:
      - 'gdfkube-src/gdfkube-itsm/**'
      - '.github/workflows/gdfkube-itsm-ci.yml'

permissions: {}

defaults:
  run:
    working-directory: gdfkube-src/gdfkube-itsm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gdfkube-src/gdfkube-itsm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    # Optional Playwright job — runs only when the PR is labeled `e2e`.
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gdfkube-src/gdfkube-itsm/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
