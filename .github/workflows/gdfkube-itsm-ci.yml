name: gdfkube-itsm CI

on:
  push:
    branches: [main]
    paths:
      - 'gdfkube-src/gdfkube-itsm/**'
      - '.github/workflows/gdfkube-itsm-ci.yml'
  pull_request:
    paths:
      - 'gdfkube-src/gdfkube-itsm/**'
      - '.github/workflows/gdfkube-itsm-ci.yml'

permissions: {}

defaults:
  run:
    working-directory: gdfkube-src/gdfkube-itsm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gdfkube-src/gdfkube-itsm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    # Optional Playwright job — runs only when the PR is labeled `e2e`.
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gdfkube-src/gdfkube-itsm/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
