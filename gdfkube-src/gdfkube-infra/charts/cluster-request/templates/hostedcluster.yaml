apiVersion: hypershift.openshift.io/v1beta1
kind: HostedCluster
metadata:
  name: {{ .Values.system.naming.hostedClusterName }}
  namespace: {{ .Values.system.naming.namespace }}
  labels:
    {{- toYaml .Values.system.labels | nindent 4 }}
spec:
  # The demo management cluster has limited worker capacity. A HighlyAvailable
  # control plane (the default) runs a 3-replica etcd with one-pod-per-node
  # anti-affinity; with more than one hosted cluster the third etcd replica
  # cannot schedule, so the control-plane-operator never creates kube-apiserver
  # and provisioning hangs. SingleReplica keeps each control plane to one replica.
  controllerAvailabilityPolicy: SingleReplica
  infrastructureAvailabilityPolicy: SingleReplica
  release:
    image: {{ .Values.system.releaseImage }}
  pullSecret:
    name: pull-secret
  sshKey:
    name: sshkey
  platform:
    type: KubeVirt
    kubevirt:
      # baseDomainPassthrough makes the hosted-cluster-config-operator derive the
      # guest ingress domain as a subdomain of THIS management cluster's *.apps
      # wildcard (apps.<hostedClusterName>.<mgmt-apps-domain>) and auto-create the
      # pass-through Service + wildcard Route on the hub. No per-cluster DNS
      # record, LoadBalancer, or non-HyperShift ingress is needed — guest
      # console/app routes resolve via the existing management *.apps wildcard.
      # Requires the management default ingresscontroller to admit wildcard routes
      # (routeAdmission.wildcardPolicy: WildcardsAllowed) — set by the platform
      # manifest platform/manifests/cluster-ingress. Mutually exclusive with
      # spec.dns.baseDomain, so the explicit dns block is intentionally omitted;
      # HCCO populates spec.dns.baseDomain automatically.
      baseDomainPassthrough: true
  networking:
    clusterNetwork:
      - cidr: {{ .Values.vars.clusterNetworkCidr | default "10.132.0.0/14" }}
    serviceNetwork:
      - cidr: {{ .Values.vars.serviceNetworkCidr | default "172.31.0.0/16" }}
    networkType: OVNKubernetes
  services:
    - service: APIServer
      servicePublishingStrategy:
        type: LoadBalancer
    - service: OAuthServer
      servicePublishingStrategy:
        type: Route
    - service: OIDC
      servicePublishingStrategy:
        type: Route
    - service: Konnectivity
      servicePublishingStrategy:
        type: Route
    - service: Ignition
      servicePublishingStrategy:
        type: Route
