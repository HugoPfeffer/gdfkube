apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: {{ .Values.system.naming.hostedClusterName }}-workers
  namespace: {{ .Values.system.naming.namespace }}
  labels:
    {{- toYaml .Values.system.labels | nindent 4 }}
spec:
  clusterName: {{ .Values.system.naming.hostedClusterName }}
  replicas: {{ .Values.vars.nodeCount | default 1 }}
  management:
    autoRepair: true
    # upgradeType defaults to Replace, which requires an explicit replace
    # strategy; without it the NodePool fails validation (UpdateManagementEnabled).
    upgradeType: Replace
    replace:
      strategy: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  release:
    image: {{ .Values.system.releaseImage }}
  platform:
    type: KubeVirt
    kubevirt:
      attachedDefaultNetwork: true
      compute:
        memory: 16Gi
        cores: 4
      nodeSelector:
        node-role.kubernetes.io/metal: ""
      rootVolume:
        type: Persistent
        persistent:
          size: 64Gi
          # The demo management cluster is AWS-backed and only provides the EBS
          # CSI storage classes (gp3-csi is default, gp2-csi). ODF/Ceph is not
          # installed, so referencing ocs-storagecluster-ceph-rbd left the CDI
          # DataVolume in ErrClaimNotValid ("no storageClass to choose profile"),
          # the RHCOS import never ran, and the worker VM hung in Provisioning.
          # gp3-csi has a default CDI StorageProfile (RWO/Filesystem) and matches
          # the class HyperShift already uses for etcd on this cluster.
          storageClass: gp3-csi
