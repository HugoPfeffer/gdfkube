apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: {{ .Values.system.naming.hostedClusterName }}-workers
  namespace: {{ .Values.system.naming.namespace }}
  labels:
    {{- toYaml .Values.system.labels | nindent 4 }}
spec:
  clusterName: {{ .Values.system.naming.hostedClusterName }}
  replicas: {{ .Values.vars.nodeCount | default 1 }}
  management:
    autoRepair: true
    # upgradeType defaults to Replace, which requires an explicit replace
    # strategy; without it the NodePool fails validation (UpdateManagementEnabled).
    upgradeType: Replace
    replace:
      strategy: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
  release:
    image: {{ .Values.system.releaseImage }}
  platform:
    type: KubeVirt
    kubevirt:
      compute:
        memory: 16Gi
        cores: 4
      rootVolume:
        type: Persistent
        persistent:
          size: 64Gi
          storageClass: ocs-storagecluster-ceph-rbd
