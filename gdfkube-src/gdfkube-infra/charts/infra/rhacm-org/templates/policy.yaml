apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .Values.meta.org }}-pullsecret-distribution
  namespace: {{ .Values.system.naming.policyNamespace }}
  labels:
    {{- toYaml .Values.system.labels | nindent 4 }}
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hc-pullsecret-distributor
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: None
          # Enforced on the hub (local-cluster). For every HostedCluster owned by
          # this org, ensure pull-secret + sshkey exist in its control-plane
          # namespace so HyperShift can provision. Both are copied from the hub
          # cluster credential Secret local-cluster/aws-credentials (the ACM
          # provider credential): the pull secret from its .dockerconfigjson key
          # and the SSH public key from its ssh-publickey key. Templated
          # dynamically so new clusters are covered without re-rendering.
          object-templates-raw: |
{{ printf `{{- range $hc := (lookup "hypershift.openshift.io/v1beta1" "HostedCluster" "" "").items }}
{{- if hasPrefix "hc-%s-" $hc.metadata.namespace }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: kubernetes.io/dockerconfigjson
    metadata:
      name: pull-secret
      namespace: '{{ $hc.metadata.namespace }}'
    data:
      .dockerconfigjson: '{{ fromSecret "local-cluster" "aws-credentials" ".dockerconfigjson" }}'
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: sshkey
      namespace: '{{ $hc.metadata.namespace }}'
    data:
      id_rsa.pub: '{{ fromSecret "local-cluster" "aws-credentials" "ssh-publickey" }}'
{{- end }}
{{- end }}` .Values.meta.org | nindent 12 }}
