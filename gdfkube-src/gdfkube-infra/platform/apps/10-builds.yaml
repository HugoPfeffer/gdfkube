apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gdfkube-builds
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/HugoPfeffer/gdfkube.git
    targetRevision: main-openshift
    path: gdfkube-src/gdfkube-infra/platform/manifests/builds
  destination:
    server: https://kubernetes.default.svc
    namespace: gdfkube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
