apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka1
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  serviceName: kafka1
  replicas: 1
  selector:
    matchLabels:
      app: kafka1
  template:
    metadata:
      labels:
        app: kafka1
    spec:
      serviceAccountName: gdfkube-anyuid
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: docker.io/apache/kafka:3.7.2
          ports:
            - containerPort: 19092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka1:19092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_CLUSTER_ID
              value: ghD8_7zXTOW9WdFd5VvQAg
            - name: CLUSTER_ID
              value: ghD8_7zXTOW9WdFd5VvQAg
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:19092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
              # Mount a subdir, not the volume root: a freshly provisioned ext4
              # PV has a lost+found dir at its root, and Kafka's LogManager
              # aborts if the log dir contains anything that isn't a partition.
              subPath: kafka-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka1
  namespace: gdfkube
spec:
  type: ClusterIP
  # KRaft peers must reach each other on :9093 before any broker is Ready.
  # Without this, the ClusterIP has no endpoints until readiness passes, but
  # readiness can't pass until the quorum forms -> permanent bootstrap deadlock.
  publishNotReadyAddresses: true
  selector:
    app: kafka1
  ports:
    - name: plaintext
      port: 19092
      targetPort: 19092
    - name: controller
      port: 9093
      targetPort: 9093
---
