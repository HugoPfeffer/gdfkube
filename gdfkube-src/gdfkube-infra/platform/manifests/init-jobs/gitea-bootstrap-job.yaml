apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-bootstrap
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gitea-jobs
      restartPolicy: OnFailure
      containers:
        - name: gitea-bootstrap
          image: docker.io/curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[gitea-bootstrap] waiting for Gitea..."
              until curl -sf http://gitea:3000/api/v1/version >/dev/null 2>&1; do sleep 3; done
              echo "[gitea-bootstrap] Gitea is up"

              AUTH="${GITEA_ADMIN_USERNAME}:${GITEA_ADMIN_PASSWORD}"

              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -u "$AUTH" \
                -X POST http://gitea:3000/api/v1/orgs \
                -H "Content-Type: application/json" \
                -d "{\"username\":\"${GITEA_ORG}\",\"visibility\":\"public\"}" || true)
              case "$STATUS" in
                201|422) echo "[gitea-bootstrap] org=${GITEA_ORG} ok (status=$STATUS)" ;;
                *) echo "[gitea-bootstrap] org create failed (status=$STATUS)" >&2; exit 1 ;;
              esac

              TOKEN_RESP=$(curl -sf -u "$AUTH" \
                -X POST "http://gitea:3000/api/v1/users/${GITEA_ADMIN_USERNAME}/tokens" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"itsm-$(date +%s)\",\"scopes\":[\"all\"]}")
              TOKEN=$(echo "$TOKEN_RESP" | sed -n 's/.*"sha1":"\([^"]*\)".*/\1/p')
              [ -z "$TOKEN" ] && TOKEN=$(echo "$TOKEN_RESP" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
              [ -z "$TOKEN" ] && { echo "[gitea-bootstrap] FATAL: empty token" >&2; exit 1; }

              echo "[gitea-bootstrap] token generated, writing to Secret gitea-pat"
              cat <<PATCH_EOF | curl -sf -X PATCH \
                -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                -H "Content-Type: application/strategic-merge-patch+json" \
                "https://kubernetes.default.svc/api/v1/namespaces/gdfkube/secrets/gitea-pat" \
                -d @- --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              {"stringData":{"token":"${TOKEN}"}}
              PATCH_EOF

              echo "[gitea-bootstrap] done"
          env:
            - name: GITEA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: password
            - name: GITEA_ORG
              value: gdfkube
