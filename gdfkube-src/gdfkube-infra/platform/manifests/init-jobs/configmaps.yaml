apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-collections-scripts
  namespace: gdfkube
data:
  init-camel-collections.js: |
    const db = db.getSiblingDB('gdfkube');

    function ensureCollection(name, options) {
      if (!db.getCollectionNames().includes(name)) {
        db.createCollection(name, options || {});
        print(`created collection ${name}`);
      } else {
        print(`collection ${name} already exists`);
      }
    }

    function ensurePreImage(name) {
      try {
        db.runCommand({ collMod: name, changeStreamPreAndPostImages: { enabled: true } });
        print(`preImages enabled on ${name}`);
      } catch (e) {
        print(`preImages collMod on ${name} skipped: ${e.message}`);
      }
    }

    ensureCollection('audit_log');
    ensureCollection('dlq_log');
    ensureCollection('debezium_signals');
    ensurePreImage('requests');
    ensurePreImage('forms');

    db.audit_log.createIndex({ at: 1 }, { expireAfterSeconds: 2592000 });
    db.audit_log.createIndex({ requestId: 1, at: -1 });
    db.dlq_log.createIndex({ topic: 1, firstSeenAt: -1 });
    db.dlq_log.createIndex({ requestId: 1 });

    print('ok');
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init-scripts
  namespace: gdfkube
data:
  init-topics.sh: |
    #!/bin/bash
    set -euo pipefail

    BOOTSTRAP="kafka1:19092"
    KAFKA_BIN="/opt/kafka/bin"

    create_topic() {
      local topic="$1" partitions="$2" rf="$3" retention_ms="$4"

      "$KAFKA_BIN/kafka-topics.sh" \
        --bootstrap-server "$BOOTSTRAP" \
        --create \
        --if-not-exists \
        --topic "$topic" \
        --partitions "$partitions" \
        --replication-factor "$rf"

      "$KAFKA_BIN/kafka-configs.sh" \
        --bootstrap-server "$BOOTSTRAP" \
        --entity-type topics \
        --entity-name "$topic" \
        --alter \
        --add-config "retention.ms=$retention_ms,min.insync.replicas=2,cleanup.policy=delete"

      echo "Topic '$topic' ready (partitions=$partitions, rf=$rf, retention=${retention_ms}ms)"
    }

    echo "=== Creating Kafka topics ==="

    create_topic "dbz.gdfkube.requests"      6 3 604800000
    create_topic "dbz.gdfkube.forms"          1 3 604800000

    create_topic "gdfkube.pipeline.status"    6 3 1209600000
    create_topic "gdfkube.audit"              3 3 2592000000

    create_topic "dlq.gdfkube.request-router"  3 3 2592000000
    create_topic "dlq.gdfkube.helm-render"    1 3 2592000000
    create_topic "dlq.gdfkube.git-push"       1 3 2592000000
    create_topic "dlq.gdfkube.repo-bootstrap" 1 3 2592000000
    create_topic "dlq.gdfkube.groups"         1 3 2592000000
    create_topic "dlq.gdfkube.status-emitter" 1 3 2592000000
    create_topic "dlq.gdfkube.audit-sink"     1 3 2592000000
    create_topic "dlq.gdfkube.config-reload"  1 3 2592000000
    create_topic "dlq.gdfkube.debezium"       1 3 2592000000

    echo "=== All 14 topics created successfully ==="
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-topics-scripts
  namespace: gdfkube
data:
  init-connect-topics.sh: |
    #!/bin/bash
    set -euo pipefail
    BOOTSTRAP="kafka1:19092"
    KAFKA_BIN="/opt/kafka/bin"

    create() {
      local topic="$1" partitions="$2"
      "$KAFKA_BIN/kafka-topics.sh" --bootstrap-server "$BOOTSTRAP" --create --if-not-exists \
        --topic "$topic" --partitions "$partitions" --replication-factor 3
      "$KAFKA_BIN/kafka-configs.sh" --bootstrap-server "$BOOTSTRAP" --entity-type topics \
        --entity-name "$topic" --alter --add-config "cleanup.policy=compact"
      echo "topic $topic ready"
    }

    create connect-configs 1
    create connect-offsets 25
    create connect-status 5
    echo "connect topics ready"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-init-scripts
  namespace: gdfkube
data:
  register-connector.sh: |
    #!/bin/sh
    set -e
    URL="http://gdfkube-debezium-connect:8083/connectors/gdfkube-mongo-source/config"
    for i in 1 2 3; do
      if curl -sf -X PUT -H 'Content-Type: application/json' --data @/connector-config.json "$URL"; then
        echo ""
        echo "connector registered"
        exit 0
      fi
      echo "retry $i..."
      sleep 2
    done
    echo "connector registration failed"
    exit 1
  connector-config.json: |
    {
      "connector.class": "io.debezium.connector.mongodb.MongoDbConnector",
      "tasks.max": "1",
      "mongodb.connection.string": "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0",
      "topic.prefix": "dbz.gdfkube",
      "database.include.list": "gdfkube",
      "collection.include.list": "gdfkube.requests,gdfkube.forms",
      "snapshot.mode": "initial",
      "capture.mode": "change_streams_update_full_with_pre_image",
      "signal.data.collection": "gdfkube.debezium_signals",
      "transforms": "unwrap,reroute",
      "transforms.unwrap.type": "io.debezium.connector.mongodb.transforms.ExtractNewDocumentState",
      "transforms.unwrap.delete.handling.mode": "rewrite",
      "transforms.unwrap.add.headers": "op,source.ts_ms",
      "transforms.unwrap.field.exclude.list": "_stageWriteback",
      "transforms.reroute.type": "org.apache.kafka.connect.transforms.RegexRouter",
      "transforms.reroute.regex": "dbz.gdfkube.gdfkube.(.*)",
      "transforms.reroute.replacement": "dbz.gdfkube.$1",
      "key.converter": "org.apache.kafka.connect.json.JsonConverter",
      "value.converter": "org.apache.kafka.connect.json.JsonConverter",
      "key.converter.schemas.enable": "false",
      "value.converter.schemas.enable": "false",
      "errors.tolerance": "all",
      "errors.deadletterqueue.topic.name": "dlq.gdfkube.debezium",
      "errors.deadletterqueue.topic.replication.factor": "3",
      "errors.deadletterqueue.context.headers.enable": "true"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonar-bootstrap-scripts
  namespace: gdfkube
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    : "${SONAR_URL:=http://sonarqube:9000}"
    : "${SONAR_ADMIN_PASSWORD:?required}"
    : "${SONAR_TOKEN_NAME:=gdfkube-analysis}"
    : "${SONAR_PROJECTS:=gdfkube-camel,gdfkube-itsm-web,gdfkube-itsm-server}"
    : "${SONAR_GATE_NAME:=gdfkube-gate}"
    TOKEN_DIR=/sonar

    log() { echo "[sonar-bootstrap] $*"; }
    api() {
      _m=$1; _p=$2; shift 2
      curl -s -o /tmp/resp -w '%{http_code}' -u "$AUTH" -X "$_m" "$SONAR_URL$_p" "$@"
    }

    # 1. Rotate default admin/admin; tolerate already-rotated (idempotent re-run).
    AUTH="admin:admin"
    ROT=$(api POST "/api/users/change_password" \
      --data-urlencode "login=admin" \
      --data-urlencode "previousPassword=admin" \
      --data-urlencode "password=$SONAR_ADMIN_PASSWORD" || echo 000)
    if [ "$ROT" = "204" ] || [ "$ROT" = "200" ]; then
      log "admin password rotated"
      AUTH="admin:$SONAR_ADMIN_PASSWORD"
    else
      AUTH="admin:$SONAR_ADMIN_PASSWORD"
      CHK=$(api GET "/api/authentication/validate" || echo 000)
      if ! grep -q '"valid":true' /tmp/resp 2>/dev/null; then
        log "FATAL: neither default nor rotated admin credentials are valid (http=$ROT/$CHK)" >&2
        exit 1
      fi
      log "admin password already rotated (idempotent)"
    fi

    # 2. Create projects (tolerate "already exists" -> 400).
    OLD_IFS=$IFS; IFS=,
    for KEY in $SONAR_PROJECTS; do
      IFS=$OLD_IFS
      C=$(api POST "/api/projects/create" \
        --data-urlencode "project=$KEY" --data-urlencode "name=$KEY" || echo 000)
      [ "$C" = "200" ] && log "project created: $KEY" || log "project $KEY exists/skip (http=$C)"
      IFS=,
    done
    IFS=$OLD_IFS

    # 3. Quality gate on New Code; set default; bind all projects.
    api POST "/api/qualitygates/create" --data-urlencode "name=$SONAR_GATE_NAME" >/dev/null || true
    addcond() {
      api POST "/api/qualitygates/create_condition" \
        --data-urlencode "gateName=$SONAR_GATE_NAME" \
        --data-urlencode "metric=$1" --data-urlencode "op=$2" \
        --data-urlencode "error=$3" >/dev/null || true
    }
    addcond new_coverage LT 80
    addcond new_duplicated_lines_density GT 3
    addcond new_maintainability_rating GT 1
    addcond new_reliability_rating GT 1
    addcond new_security_rating GT 1
    addcond new_blocker_violations GT 0
    addcond new_critical_violations GT 0
    api POST "/api/qualitygates/set_as_default" \
      --data-urlencode "name=$SONAR_GATE_NAME" >/dev/null || true
    OLD_IFS=$IFS; IFS=,
    for KEY in $SONAR_PROJECTS; do
      IFS=$OLD_IFS
      api POST "/api/qualitygates/select" \
        --data-urlencode "gateName=$SONAR_GATE_NAME" \
        --data-urlencode "projectKey=$KEY" >/dev/null || true
      IFS=,
    done
    IFS=$OLD_IFS

    # 4. Mint a fresh global analysis token into the sonar-init volume.
    mkdir -p "$TOKEN_DIR"
    api POST "/api/user_tokens/generate" \
      --data-urlencode "name=${SONAR_TOKEN_NAME}-$(date +%s)" \
      --data-urlencode "type=GLOBAL_ANALYSIS_TOKEN" >/dev/null
    TOKEN=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' /tmp/resp)
    if [ -z "$TOKEN" ]; then
      log "FATAL: token generation returned empty token" >&2
      exit 1
    fi
    printf '%s' "$TOKEN" > "$TOKEN_DIR/token"
    chmod 600 "$TOKEN_DIR/token"
    printf '%s' "$SONAR_URL" > "$TOKEN_DIR/url"
    unset TOKEN
    log "done: projects=$SONAR_PROJECTS gate=$SONAR_GATE_NAME url=$SONAR_URL"
