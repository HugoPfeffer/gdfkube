apiVersion: batch/v1
kind: Job
metadata:
  name: gdfkube-connect-topics-init
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: connect-topics-init
          image: apache/kafka:3.7.2
          command: ["bash", "/scripts/init-connect-topics.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: connect-topics-scripts
            defaultMode: 0755
