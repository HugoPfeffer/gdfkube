apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-repo-seed
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    # PostSync + HookFailed: runs after the init Sync phase, persists on
    # success, retried cleanly on failure. Wave 16 runs after gitea-bootstrap
    # (wave 15) so Gitea and the org exist before the repo is seeded.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: gitea-seed
          image: docker.io/alpine/git:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export HOME=/tmp

              TOKEN=$(cat /etc/gitea-pat/token)
              [ -z "$TOKEN" ] && { echo "[gitea-repo-seed] empty PAT" >&2; exit 1; }

              for REPO in gdfkube-main; do
                if wget -q -O /dev/null \
                     --header="Authorization: token $TOKEN" \
                     --header="Content-Type: application/json" \
                     --post-data="{\"name\":\"$REPO\",\"auto_init\":false,\"default_branch\":\"main\"}" \
                     "http://gitea:3000/api/v1/orgs/gdfkube/repos" 2>/dev/null; then
                  echo "[gitea-repo-seed] repo=$REPO created"
                elif wget -q -O /dev/null \
                       --header="Authorization: token $TOKEN" \
                       "http://gitea:3000/api/v1/repos/gdfkube/$REPO" 2>/dev/null; then
                  echo "[gitea-repo-seed] repo=$REPO already exists"
                else
                  echo "[gitea-repo-seed] repo=$REPO create failed" >&2; exit 1
                fi
              done

              WORK=$(mktemp -d)
              git clone --depth 1 -b main-openshift https://github.com/HugoPfeffer/gdfkube.git "$WORK/src"
              cd "$WORK/src/gdfkube-src"

              find . \( -name node_modules -o -name target -o -name dist -o -name build -o -name .git -o -name .DS_Store -o -name '*.pem' -o -name '*.key' \) -prune -exec rm -rf {} +
              find . \( -name '.env' -o -name '.env.*' \) -type f -delete

              git init -q -b main
              git config user.email "bootstrap@gdfkube.local"
              git config user.name "gitea-bootstrap"
              git add -A
              git commit -q -m "Initial bootstrap from GitHub ($(date -u +%FT%TZ))"

              REMOTE="http://${GITEA_ADMIN_USERNAME}:${TOKEN}@gitea:3000/gdfkube/gdfkube-main.git"
              git push -q --force "$REMOTE" main

              cd /; rm -rf "$WORK"
              echo "[gitea-repo-seed] done"
          env:
            - name: GITEA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-admin
                  key: username
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: gitea-pat
              mountPath: /etc/gitea-pat
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
      volumes:
        - name: gitea-pat
          secret:
            secretName: gitea-pat
