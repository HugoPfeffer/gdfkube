apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-collections-init
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-collections-init
          image: docker.io/library/mongo:7.0
          command:
            - mongosh
            - "mongodb://mongo1:27017/gdfkube?replicaSet=rs0"
            - /scripts/init-camel-collections.js
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: mongo-collections-scripts
