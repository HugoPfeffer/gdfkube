apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-token-sync
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    # PostSync + HookFailed: runs after the init Sync phase, persists on
    # success, retried cleanly on failure. Wave 16 runs after gitea-bootstrap
    # (wave 15) has populated the gitea-pat secret.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: token-sync
          image: docker.io/library/mongo:7.0
          env:
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              GITEA_LOCAL_TOKEN=$(cat /etc/gitea-pat/token)
              [ -z "$GITEA_LOCAL_TOKEN" ] && { echo "[gitea-token-sync] empty token" >&2; exit 1; }
              export GITEA_LOCAL_TOKEN
              mongosh --quiet "mongodb://mongo1:27017/gdfkube?replicaSet=rs0&serverSelectionTimeoutMS=10000" --eval '
                db.gitea_settings.updateOne(
                  { _id: "gitea" },
                  { $set: {
                      endpoint: "http://gitea:3000",
                      owner: "gdfkube",
                      token: process.env.GITEA_LOCAL_TOKEN,
                      updatedBy: "gitea-init",
                      updatedAt: new Date()
                    } },
                  { upsert: true }
                );
              '
              unset GITEA_LOCAL_TOKEN
              echo "[gitea-token-sync] gitea_settings upserted"
          volumeMounts:
            - name: gitea-pat
              mountPath: /etc/gitea-pat
              readOnly: true
      volumes:
        - name: gitea-pat
          secret:
            secretName: gitea-pat
