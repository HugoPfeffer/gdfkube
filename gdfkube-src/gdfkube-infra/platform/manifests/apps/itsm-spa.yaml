apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "55"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"gdfkube-itsm:latest","namespace":"gdfkube"},"fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itsm
  template:
    metadata:
      labels:
        app: itsm
    spec:
      containers:
        - name: itsm
          image: " "
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: itsm
  namespace: gdfkube
spec:
  type: ClusterIP
  selector:
    app: itsm
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: itsm
  namespace: gdfkube
spec:
  to:
    kind: Service
    name: itsm
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
