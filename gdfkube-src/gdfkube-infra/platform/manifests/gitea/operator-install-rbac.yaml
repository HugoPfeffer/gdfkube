apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-operator-installer
  namespace: gdfkube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-operator-installer
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-operator-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-operator-installer
subjects:
  - kind: ServiceAccount
    name: gitea-operator-installer
    namespace: gdfkube
