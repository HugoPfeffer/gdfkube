apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-operator-installer
  namespace: gdfkube
  # Must exist before the wave -11 install Job hook can run.
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-operator-installer
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-operator-installer
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-operator-installer
subjects:
  - kind: ServiceAccount
    name: gitea-operator-installer
    namespace: gdfkube
