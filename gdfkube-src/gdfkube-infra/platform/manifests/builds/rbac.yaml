apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-bootstrap
  namespace: gdfkube
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: build-starter
  namespace: gdfkube
rules:
  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs", "buildconfigs/instantiate"]
    verbs: ["get", "list", "create", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-bootstrap-starter
  namespace: gdfkube
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: build-starter
subjects:
  - kind: ServiceAccount
    name: build-bootstrap
    namespace: gdfkube
