apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdfkube-debezium-connect
  namespace: gdfkube
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gdfkube-debezium-connect
  template:
    metadata:
      labels:
        app: gdfkube-debezium-connect
    spec:
      serviceAccountName: gdfkube-anyuid
      containers:
        - name: debezium-connect
          image: docker.io/debezium/connect:2.7.3.Final
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka1:19092,kafka2:19092,kafka3:19092"
            - name: GROUP_ID
              value: gdfkube-connect
            - name: CONFIG_STORAGE_TOPIC
              value: connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: connect-status
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gdfkube-debezium-connect
  namespace: gdfkube
spec:
  type: ClusterIP
  selector:
    app: gdfkube-debezium-connect
  ports:
    - port: 8083
      targetPort: 8083
