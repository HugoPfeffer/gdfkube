# Manual bootstrap entrypoint (alternative to RHDP ordering).
# Usage: oc apply -n openshift-gitops -f app-of-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gdfkube-platform
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HugoPfeffer/gdfkube.git
    targetRevision: worktree-openshift-argocd-bootstrap-plan
    path: gdfkube-src/gdfkube-infra/platform
    helm:
      valuesObject:
        deployer:
          domain: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
