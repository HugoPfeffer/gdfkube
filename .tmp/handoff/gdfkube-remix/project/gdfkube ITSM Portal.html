<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>gdfkube · IT Service Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#102a52"/>
    <rect x="60" y="60" width="80" height="80" fill="#fff"/>
    <rect x="60" y="135" width="80" height="5" fill="#2b86d9"/>
    <text x="100" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="60" font-weight="700" fill="#102a52">g</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="catalog.jsx"></script>
<script type="text/babel" src="new-request.jsx"></script>
<script type="text/babel" src="requests-list.jsx"></script>
<script type="text/babel" src="request-detail.jsx"></script>
<script type="text/babel" src="approvals.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "compact",
  "theme": "light",
  "sidebarCollapsed": false,
  "pipelineSpeed": 1,
  "showDemoBanner": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [route, setRouteRaw] = useState("home");
  const [routeParams, setRouteParams] = useState({});
  const [role, setRole] = useState("operator");
  const [toast, setToast] = useState(null);

  const navigate = (r, params = {}) => {
    setRouteRaw(r);
    setRouteParams(params);
    if (r === "request-detail" && params.fresh) {
      setToast({ type: "success", title: "Request submitted", body: "Cluster " + params.id + " is now provisioning. Watch the pipeline below." });
      setTimeout(() => setToast(null), 5000);
    }
    if (r === "request-detail" && params.submitted) {
      setToast({ type: "info", title: "Request submitted for approval", body: params.id + " is pending review by a platform administrator." });
      setTimeout(() => setToast(null), 5000);
    }
    document.querySelector(".main")?.scrollTo(0, 0);
  };

  // If admin disallowed routes
  useEffect(() => {
    if (role === "operator" && (route === "admin-forms" || route === "admin-users" || route === "policies" || route === "approvals")) navigate("home");
  }, [role]);

  const user = role === "admin"
    ? { name: "Maria Costa", username: "m.costa", initials: "MC", org: "SETIC" }
    : { name: "João Silva", username: "joao.silva", initials: "JS", org: "Saúde" };

  const crumbs = (() => {
    switch (route) {
      case "home":           return ["Home"];
      case "catalog":        return ["Service Catalog"];
      case "new-request": {
        const fid = routeParams.formId || "cluster-request";
        const f = (window.GDF_ADMIN_DATA && window.GDF_ADMIN_DATA.forms || []).find(x => x.id === fid);
        const title = (window.FORM_PRESENTATION && window.FORM_PRESENTATION[fid] && window.FORM_PRESENTATION[fid].shortTitle) || (f && f.name) || "New request";
        return ["Service Catalog", title, "New request"];
      }
      case "requests":       return [role === "admin" ? "All requests" : "My requests"];
      case "request-detail": return [role === "admin" ? "All requests" : "My requests", routeParams.id || ""];
      case "admin-forms":    return ["Administration", "Forms"];
      case "admin-users":    return ["Administration", "Users"];
      case "approvals":      return ["Approvals"];
      case "policies":       return ["Policies"];
      case "reports":        return ["Reports"];
      case "audit":          return ["Audit Log"];
      default:               return ["Home"];
    }
  })();

  let page = null;
  switch (route) {
    case "home":           page = <Dashboard navigate={navigate} role={role} />; break;
    case "catalog":        page = <Catalog navigate={navigate} />; break;
    case "new-request":    page = <NewRequest navigate={navigate} role={role} user={user} formId={routeParams.formId} />; break;
    case "requests":       page = <RequestsList navigate={navigate} role={role} />; break;
    case "request-detail": page = <RequestDetail id={routeParams.id} navigate={navigate} role={role} fresh={routeParams.fresh} pipelineSpeed={tweaks.pipelineSpeed} />; break;
    case "admin-forms":    page = <AdminConsole navigate={navigate} section="forms" />; break;
    case "admin-users":    page = <AdminConsole navigate={navigate} section="users" />; break;
    case "approvals":     page = <Approvals navigate={navigate} role={role} />; break;
    case "policies":
    case "reports":
    case "audit":
      page = (
        <div className="page">
          <div className="page-head"><h1 className="page-title">{crumbs[0]}</h1><p className="page-sub">This module is included in the navigation but not part of the demo scope.</p></div>
          <div className="card"><div className="empty"><Icons.cog size={32} /><div style={{marginTop: 8}}>Module placeholder</div></div></div>
        </div>
      );
      break;
    default: page = <Dashboard navigate={navigate} role={role} />;
  }

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme);
  }, [tweaks.theme]);

  return (
    <div className="app" data-density={tweaks.density}>
      <UtilityBand />
      <Sidebar route={route} navigate={navigate} role={role} collapsed={tweaks.sidebarCollapsed} />
      <Topbar crumbs={crumbs} role={role} setRole={setRole} user={user} onNotify={() => setToast({type: "info", title: "3 new notifications", body: "REQ0010247 entered Camel processing · 2 more"})} />
      <main className="main">{page}</main>

      {toast && (
        <div className="toast-stack">
          <div className={"toast " + (toast.type || "")}>
            <div style={{flexShrink: 0, marginTop: 1, color: toast.type === "success" ? "var(--green-700)" : "var(--civic-500)"}}>
              {toast.type === "success" ? <Icons.check /> : <Icons.info />}
            </div>
            <div style={{flex: 1}}>
              <strong>{toast.title}</strong>
              <span>{toast.body}</span>
            </div>
            <div onClick={() => setToast(null)} style={{cursor: "pointer", color: "var(--ink-400)"}}><Icons.x /></div>
          </div>
        </div>
      )}

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Appearance">
          <window.TweakRadio label="Theme" value={tweaks.theme} onChange={v => setTweak("theme", v)} options={[{value: "light", label: "Light"}, {value: "dark", label: "Dark"}]} />
          <window.TweakRadio label="Density" value={tweaks.density} onChange={v => setTweak("density", v)} options={[{value: "comfortable", label: "Comfortable"}, {value: "compact", label: "Compact"}]} />
          <window.TweakToggle label="Collapse sidebar" value={tweaks.sidebarCollapsed} onChange={v => setTweak("sidebarCollapsed", v)} />
        </window.TweakSection>
        <window.TweakSection title="Demo">
          <window.TweakSlider label="Pipeline animation speed" value={tweaks.pipelineSpeed} onChange={v => setTweak("pipelineSpeed", v)} min={0.5} max={4} step={0.1} />
          <window.TweakToggle label="Show demo banner" value={tweaks.showDemoBanner} onChange={v => setTweak("showDemoBanner", v)} />
        </window.TweakSection>
        <window.TweakSection title="Quick actions">
          <window.TweakButton onClick={() => { setRole(role === "admin" ? "operator" : "admin"); }}>
            Switch to {role === "admin" ? "Operator" : "Admin"} role
          </window.TweakButton>
          <window.TweakButton onClick={() => navigate("new-request")}>Open new-request flow</window.TweakButton>
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
