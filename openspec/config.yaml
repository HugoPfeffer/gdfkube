# openspec/config.yaml
schema: superpowers-bridge

context: |
  Tech stack: Quarkus, Helm, Apache Kafka, MongoDB, Debezium, Apache Camel, NodeJS
  API style: RESTful, documented in docs/api.md
  Docs Style: Markdown, all documented in docs/ directory
  Testing: JUnit, Testcontainers, Mockito, WireMock
  We value simplicity and readability over complexity and verbosity
  We value changing functions and services over adding new ones
  We deeply value mantainability and driftless codebases

rules:
  proposal:
    - Quantify blast radius — list every affected service, API endpoint, Kafka topic, and downstream consumer
    - Pin dependency versions and flag conflicts with existing versions in the stack
    - Outline testing strategy (unit, integration, contract) per affected component
  specs:
    - Use Given/When/Then for every scenario
    - Reference existing specs and patterns before introducing new abstractions
    - Every requirement must map to at least one verifiable scenario
  design:
    - Include only diagrams that clarify non-obvious interactions; prefer sequence and component diagrams over exhaustive coverage
    - Justify each architectural decision with alternatives considered and trade-offs
    - Call out migration concerns for MongoDB schema changes, Kafka consumer group rebalancing, or Helm value changes
  verify:
    - Report code-coverage delta (before vs after) for touched modules
    - Flag any spec requirement without a corresponding test
  retrospective:
    - Cite concrete evidence (commit hashes, test names, metrics) for every claim
    - Separate actionable next steps from general observations
    - Identify reusable patterns worth promoting to project rules or skills
