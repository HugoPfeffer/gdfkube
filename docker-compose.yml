services:
  itsm:
    build: ./gdfkube-src/gdfkube-itsm
    image: gdfkube-itsm:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      gdfkube-itsm-api:
        condition: service_healthy
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  mongo-seed:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/mongodb/seed-collections.js:/scripts/seed-collections.js:ro
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/mongodb/seed-data:/seed-data:ro
    networks:
      - gdfkube-net
    entrypoint:
      [
        "mongosh",
        "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/gdfkube?replicaSet=rs0",
        "/scripts/seed-collections.js",
      ]

  mongo-collections-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/mongodb/init-camel-collections.js:/init-camel-collections.js:ro
    networks:
      - gdfkube-net
    entrypoint:
      [
        "mongosh",
        "mongodb://mongo1:27017/gdfkube?replicaSet=rs0",
        "/init-camel-collections.js",
      ]

  gdfkube-itsm-api:
    build: ./gdfkube-src/gdfkube-itsm/server
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo1:27017/gdfkube?replicaSet=rs0
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092
    depends_on:
      mongo-seed:
        condition: service_completed_successfully
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      gitea-token-sync:
        condition: service_completed_successfully
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz/live"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  mongo1:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1-data:/data/db
    networks:
      - gdfkube-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo2:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2-data:/data/db
    networks:
      - gdfkube-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo3:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3-data:/data/db
    networks:
      - gdfkube-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/mongodb/init-rs.js:/scripts/init-rs.js:ro
    networks:
      - gdfkube-net
    entrypoint: ["mongosh", "--host", "mongo1:27017", "/scripts/init-rs.js"]

  kafka1:
    image: apache/kafka:3.7.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:19092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CLUSTER_ID: ghD8_7zXTOW9WdFd5VvQAg
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks:
      - gdfkube-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 | grep -q ApiVersion",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka2:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CLUSTER_ID: ghD8_7zXTOW9WdFd5VvQAg
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks:
      - gdfkube-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 | grep -q ApiVersion",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka3:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CLUSTER_ID: ghD8_7zXTOW9WdFd5VvQAg
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks:
      - gdfkube-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 | grep -q ApiVersion",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.2
    restart: "no"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    networks:
      - gdfkube-net
    entrypoint: ["bash", "/scripts/init-topics.sh"]

  gdfkube-connect-topics-init:
    image: apache/kafka:3.7.2
    restart: "no"
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/debezium/init-connect-topics.sh:/scripts/init-connect-topics.sh:ro
    networks: [gdfkube-net]
    entrypoint: ["bash", "/scripts/init-connect-topics.sh"]

  gdfkube-debezium-connect:
    image: debezium/connect:2.7.3.Final
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      GROUP_ID: gdfkube-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      gdfkube-connect-topics-init: { condition: service_completed_successfully }
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gdfkube-debezium-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      gdfkube-debezium-connect: { condition: service_healthy }
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/debezium/connector-config.json:/connector-config.json:ro
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/debezium/register-connector.sh:/register-connector.sh:ro
    networks:
      - gdfkube-net
    entrypoint: ["sh", "/register-connector.sh"]

  gitea:
    image: gitea/gitea:1.22
    container_name: gdfkube-gitea
    networks: [gdfkube-net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - gitea-data:/data
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: gitea
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://127.0.0.1:3001/"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__log__LEVEL: warn
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:3000/api/v1/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  gitea-bootstrap:
    image: gitea/gitea:1.22
    container_name: gdfkube-gitea-bootstrap
    networks: [gdfkube-net]
    restart: "no"
    depends_on:
      gitea: { condition: service_healthy }
    volumes:
      - gitea-data:/data
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/gitea/bootstrap.sh:/bootstrap.sh:ro
    environment:
      GITEA_ADMIN_USERNAME: "${GITEA_ADMIN_USERNAME:-gdfkube-admin}"
      GITEA_ADMIN_PASSWORD: "${GITEA_ADMIN_PASSWORD:-admin}"
      GITEA_ADMIN_EMAIL: "${GITEA_ADMIN_EMAIL:-admin@gdfkube.local}"
      GITEA_TOKEN_NAME: "${GITEA_TOKEN_NAME:-itsm-local}"
      GITEA_ORG: "${GITEA_ORG:-gdfkube}"
    entrypoint: ["sh", "/bootstrap.sh"]

  gitea-repo-seed:
    image: gitea/gitea:1.22
    container_name: gdfkube-gitea-repo-seed
    networks: [gdfkube-net]
    restart: "no"
    depends_on:
      gitea-bootstrap: { condition: service_completed_successfully }
    volumes:
      - gitea-data:/data:ro
      - "${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src:/workspace-src:ro"
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/gitea/seed-repos.sh:/seed-repos.sh:ro
    environment:
      GITEA_ADMIN_USERNAME: "${GITEA_ADMIN_USERNAME:-gdfkube-admin}"
      GITEA_ORG: "${GITEA_ORG:-gdfkube}"
      GITEA_REPO_MAIN: "${GITEA_REPO_MAIN:-gdfkube-main}"
    entrypoint: ["sh", "/seed-repos.sh"]

  gitea-token-sync:
    image: mongo:7.0
    container_name: gdfkube-gitea-token-sync
    networks: [gdfkube-net]
    restart: "no"
    depends_on:
      gitea-bootstrap: { condition: service_completed_successfully }
      mongo-seed: { condition: service_completed_successfully }
    volumes:
      - gitea-data:/data:ro
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/gitea/sync-token.sh:/scripts/sync-token.sh:ro
    environment:
      GITEA_ORG: "${GITEA_ORG:-gdfkube}"
    entrypoint: ["sh", "/scripts/sync-token.sh"]

  sonar-db:
    image: postgres:15.10-alpine
    container_name: gdfkube-sonar-db
    networks: [gdfkube-net]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  sonarqube:
    image: sonarqube:2025.1.1-community
    container_name: gdfkube-sonarqube
    networks: [gdfkube-net]
    restart: unless-stopped
    depends_on:
      sonar-db: { condition: service_healthy }
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonar-db:5432/sonar"
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_WEB_JAVAADDITIONALOPTS: "-Xms512m -Xmx768m"
      SONAR_CE_JAVAADDITIONALOPTS: "-Xms512m -Xmx768m"
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Xms512m -Xmx512m"
    ulimits:
      nofile: 65536
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 120s

  sonar-bootstrap:
    image: curlimages/curl:8.11.1
    container_name: gdfkube-sonar-bootstrap
    networks: [gdfkube-net]
    restart: "no"
    depends_on:
      sonarqube: { condition: service_healthy }
    volumes:
      - sonar-init:/sonar
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/sonarqube/bootstrap.sh:/bootstrap.sh:ro
    environment:
      SONAR_URL: "http://sonarqube:9000"
      SONAR_ADMIN_PASSWORD: "${SONAR_ADMIN_PASSWORD:-gdfkube-sonar-admin}"
      SONAR_DB_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
      SONAR_TOKEN_NAME: "${SONAR_TOKEN_NAME:-gdfkube-analysis}"
      SONAR_PROJECTS: "${SONAR_PROJECTS:-gdfkube-camel,gdfkube-itsm-web,gdfkube-itsm-server}"
    entrypoint: ["sh", "/bootstrap.sh"]

  gdfkube-camel:
    build:
      context: ./gdfkube-src/gdfkube-camel
      dockerfile: Dockerfile.jvm
    image: gdfkube-camel:dev
    environment:
      QUARKUS_PROFILE: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/gdfkube?replicaSet=rs0
      APP_SYSTEM_GITEA_EXTERNAL_URL: "http://gitea:3000"
      APP_SYSTEM_GITEA_OWNER: "${GITEA_ORG:-gdfkube}"
    volumes:
      - ${COMPOSE_HOST_WORKSPACE:-.}/gdfkube-src/gdfkube-infra/charts:/opt/charts:ro
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
      mongo1: { condition: service_healthy }
      gdfkube-debezium-init: { condition: service_completed_successfully }
      mongo-collections-init: { condition: service_completed_successfully }
      gitea-repo-seed: { condition: service_completed_successfully }
    networks:
      - gdfkube-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8080/q/health/ready | grep -q UP",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

networks:
  gdfkube-net:
    driver: bridge

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  gitea-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonar-db-data:
  sonar-init:
