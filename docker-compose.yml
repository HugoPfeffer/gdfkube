services:
  itsm:
    build: ./gdfkube-src/gdfkube-itsm
    image: gdfkube-itsm:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  mongo1:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1-data:/data/db
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo2:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2-data:/data/db
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo3:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3-data:/data/db
    networks:
      - gdfkube-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./gdfkube-src/gdfkube-infra/mongodb/init-rs.js:/scripts/init-rs.js:ro
    networks:
      - gdfkube-net
    entrypoint: ["mongosh", "--host", "mongo1:27017", "/scripts/init-rs.js"]

networks:
  gdfkube-net:
    driver: bridge

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
