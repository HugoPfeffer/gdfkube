version: '3.8'
services:
  app:
    image: crm-mock-app:latest
    container_name: crm-mock-app
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://root:root@mongodb:27017/crm-mock?authSource=admin
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
